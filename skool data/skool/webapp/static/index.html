<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skool Browser</title>
<link rel="preconnect" href="https://assets.skool.com">
<style>
:root {
  --bg: #0f1115;
  --bg-soft: #171a21;
  --card: #1c2029;
  --card-hover: #232936;
  --border: #2b3141;
  --text: #e8eaf0;
  --text-dim: #9aa3b5;
  --text-faint: #6b7280;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,.14);
  --ok: #22c55e;
  --warn: #f59e0b;
  --err: #ef4444;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.10), transparent 60%),
    var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
img { display: block; }

/* ── layout ── */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
header.top {
  position: sticky; top: 0; z-index: 50;
  background: rgba(15,17,21,.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.top-inner { display: flex; align-items: center; gap: 22px; height: 62px; }
.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 18px; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: grid; place-items: center; font-size: 16px;
}
.tabbar { display: flex; gap: 6px; }
.tab {
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
  color: var(--text-dim); border: 1px solid transparent;
  font-size: 14px; font-weight: 500; background: transparent; transition: .18s;
}
.tab:hover { color: var(--text); background: var(--bg-soft); }
.tab.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(99,102,241,.4); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--text-faint); font-size: 13px; }
.header-actions .count-badge { color: var(--text-dim); }

main { padding: 26px 0 80px; }
.view { display: none; }
.view.active { display: block; }

h1.section-title { font-size: 22px; font-weight: 700; margin: 6px 0 4px; }
.section-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }

/* ── filter bar ── */
.filter-panel {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px 18px;
  margin-bottom: 22px;
}
.filter-grid {
  display: grid; gap: 12px 14px;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}
.field label {
  display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-faint); margin-bottom: 5px; font-weight: 600;
}
.field select, .field input[type=text], .field input[type=number], .field .range {
  width: 100%; padding: 8px 10px; font-size: 14px;
  background: var(--card); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  outline: none; transition: border .15s;
}
.field select:focus, .field input:focus { border-color: var(--accent); }
.field select option { background: var(--card); }
.field .range { display: flex; align-items: center; gap: 6px; }
.field .range input { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; }
.field .range span { color: var(--text-faint); }
.range-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.filter-actions {
  display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap;
}
.btn {
  padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; border: 1px solid var(--border);
  background: var(--card); color: var(--text); transition: .15s;
}
.btn:hover { background: var(--card-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn.ghost:hover { color: var(--text); }
.active-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid rgba(99,102,241,.35); border-radius: 999px; font-size: 13px;
}
.chip button {
  border: none; background: none; color: inherit; cursor: pointer; font-size: 15px; line-height: 1;
}
.filter-summary { color: var(--text-faint); font-size: 13px; margin-left: auto; }

/* ── grid ── */
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; transition: transform .16s, box-shadow .16s, border-color .16s;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-3px); border-color: rgba(99,102,241,.5); box-shadow: var(--shadow); }
.card-cover {
  height: 132px; position: relative; background-size: cover; background-position: center;
  background-color: var(--bg-soft);
}
.card-cover .logo-badge {
  position: absolute; left: 12px; bottom: -22px; width: 52px; height: 52px;
  border-radius: 12px; border: 3px solid var(--card); background: var(--bg-soft);
  overflow: hidden; display: grid; place-items: center;
}
.card-cover .logo-badge img { width: 100%; height: 100%; object-fit: cover; }
.card-cover .logo-badge .initials { font-weight: 700; color: var(--text-dim); font-size: 17px; }
.card-body { padding: 18px 16px 8px; flex: 1; }
.card-title { font-weight: 650; font-size: 16px; line-height: 1.3; margin-bottom: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-owner { color: var(--text-faint); font-size: 13px; margin-bottom: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-desc { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-stats { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 14px; border-top: 1px solid var(--border); }
.stat { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim);
  background: var(--bg-soft); padding: 4px 9px; border-radius: 999px; }
.stat .v { color: var(--text); font-weight: 600; }
.stat.accent { color: var(--accent); }
.stat .v.accent { color: var(--accent); }

/* ── empty / loading ── */
.box-empty { text-align: center; padding: 70px 20px; color: var(--text-faint); }
.box-empty .big { font-size: 40px; margin-bottom: 12px; }
.loader-line { height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; position: relative; margin-bottom: 20px; }
.loader-line::after {
  content: ""; position: absolute; inset: 0; width: 40%;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: slide 1s infinite ease-in-out;
}
@keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(300%);} }

/* ── pagination ── */
.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 28px; }
.pager button {
  min-width: 38px; height: 38px; border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 14px; transition: .15s;
}
.pager button:hover:not(:disabled) { background: var(--card-hover); }
.pager button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pager button:disabled { opacity: .35; cursor: not-allowed; }
.pager .ellipsis { color: var(--text-faint); }

/* ── modal ── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; display: none;
  background: rgba(3,5,9,.72); backdrop-filter: blur(4px);
  align-items: flex-start; justify-content: center; padding: 40px 18px; overflow-y: auto;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: 100%; max-width: 900px; background: var(--card);
  border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
  box-shadow: var(--shadow); animation: pop .22s ease;
}
@keyframes pop { from { transform: translateY(14px); opacity: 0;} to { transform: none; opacity: 1;} }
.modal-hero {
  position: relative; height: 220px; background-size: cover; background-position: center;
  background-color: var(--bg-soft);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.modal-hero img.hero-img {
  width: 100%; height: 100%; object-fit: contain;
  background: var(--bg-soft);
}
.modal-hero .hero-fallback { color: var(--text-faint); font-size: 44px; }
.modal-hero .avatar {
  position: absolute; left: 26px; bottom: -44px; width: 92px; height: 92px;
  border-radius: 18px; border: 4px solid var(--card); background: var(--bg-soft);
  overflow: hidden; display: grid; place-items: center;
}
.modal-hero .avatar img { width: 100%; height: 100%; object-fit: cover; }
.modal-hero .avatar .initials { font-size: 28px; }
.modal-hero .avatar .initials { font-size: 30px; font-weight: 700; color: var(--text-dim); }
.modal-close {
  position: absolute; top: 14px; right: 14px; width: 36px; height: 36px;
  border-radius: 999px; border: none; cursor: pointer;
  background: rgba(0,0,0,.4); color: #fff; font-size: 18px; display: grid; place-items: center;
  transition: .15s;
}
.modal-close:hover { background: rgba(0,0,0,.65); }
.modal-cover-label { position: absolute; bottom: 10px; right: 14px; color: var(--text-dim); background: rgba(0,0,0,.45); padding: 2px 9px; border-radius: 999px; font-size: 11px; }
.modal-body { padding: 62px 28px 28px; }
.modal-title { font-size: 24px; font-weight: 700; margin-bottom: 2px; padding-right: 6px; }
.modal-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 16px; }
.metric-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 18px 0; }
.metric { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; }
.metric .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-bottom: 3px; }
.metric .v { font-size: 17px; font-weight: 700; }
.modal-sec { margin-top: 20px; }
.modal-sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 8px; }
.modal-desc { color: var(--text-dim); font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
.socials { display: flex; flex-wrap: wrap; gap: 8px; }
.social {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 999px;
  font-size: 13px; color: var(--text-dim);
}
.social svg { width: 15px; height: 15px; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.mini-card {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
  overflow: hidden; cursor: pointer; transition: .15s; display: flex; gap: 10px;
}
.mini-card:hover { border-color: var(--accent); }
.mini-card .t { position: relative; width: 74px; flex-shrink: 0; background-size: cover; background-position: center; background-color: var(--bg-soft); }
.mini-card .t .i { position: absolute; left: 5px; bottom: 5px; width: 26px; height: 26px; border-radius: 6px; overflow: hidden; border: 2px solid var(--bg-soft); background: var(--card); display: grid; place-items: center; }
.mini-card .t .i img { width: 100%; height: 100%; object-fit: cover; }
.mini-card .c { padding: 9px 10px; overflow: hidden; }
.mini-card .c .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-card .c .s { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
.modal-loading { padding: 60px; text-align: center; color: var(--text-dim); }

/* ── misc ── */
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.badge.pub { background: rgba(34,197,94,.15); color: var(--ok); }
.badge.priv { background: rgba(239,68,68,.15); color: var(--err); }
.badge.price { background: var(--accent-soft); color: var(--accent); }
.badge.free { background: rgba(34,197,94,.15); color: var(--ok); }
.price-text { font-weight: 700; }
.bio-snip { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin-top: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

@media (max-width: 640px) {
  .top-inner { flex-wrap: wrap; height: auto; padding: 10px 0; gap: 10px; }
  .modal-body { padding: 56px 18px 20px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand"><span class="logo">🔎</span> Skool Browser</div>
    <nav class="tabbar">
      <button class="tab active" data-view="groups">Groups</button>
      <button class="tab" data-view="users">Users</button>
    </nav>
    <div class="header-actions">
      <span id="head-count" class="count-badge"></span>
      <span id="head-db" style="opacity:.8"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- GROUPS VIEW -->
  <section id="view-groups" class="view active">
    <h1 class="section-title">Groups</h1>
    <div class="section-sub">Browse the harvested Skool communities and drill into any of them.</div>

    <div class="filter-panel" id="groups-filters">
      <div class="filter-grid">
        <div class="field"><label>Search</label><input type="text" id="g-q" placeholder="name, owner, keyword…" autocomplete="off"></div>
        <div class="field"><label>Category</label><select id="g-category"></select></div>
        <div class="field"><label>Language</label><select id="g-language"></select></div>
        <div class="field"><label>Price bucket</label><select id="g-bucket"></select></div>
        <div class="field"><label>Visibility</label><select id="g-public"></select></div>
        <div class="field"><label>Interval</label><select id="g-interval"></select></div>
        <div class="field"><label>Only with details</label><select id="g-detail"><option value="">Any</option><option value="true">Yes</option></select></div>
        <div class="field"><label>Sort by</label><select id="g-sort">
          <option value="members_desc">Members ↓</option>
          <option value="members_asc">Members ↑</option>
          <option value="price_desc">Price ↓</option>
          <option value="price_asc">Price ↑</option>
          <option value="courses_desc">Courses ↓</option>
          <option value="posts_desc">Posts ↓</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="name">Name A–Z</option>
        </select></div>
        <div class="range-group">
          <div class="field"><label>Price USD · min</label><input type="number" id="g-min-price" min="0" step="any"></div>
          <div class="field"><label>max</label><input type="number" id="g-max-price" min="0" step="any"></div>
        </div>
        <div class="range-group">
          <div class="field"><label>Members · min</label><input type="number" id="g-min-members" min="0"></div>
          <div class="field"><label>max</label><input type="number" id="g-max-members" min="0"></div>
        </div>
        <div class="range-group">
          <div class="field"><label>Courses · min</label><input type="number" id="g-min-courses" min="0"></div>
          <div class="field"><label>Posts · min</label><input type="number" id="g-min-posts" min="0"></div>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn primary" id="g-apply">Apply filters</button>
        <button class="btn ghost" id="g-clear">Clear</button>
        <div class="active-filters" id="g-chips"></div>
        <span class="filter-summary" id="g-summary"></span>
      </div>
    </div>

    <div id="g-loading" style="display:none"><div class="loader-line"></div></div>
    <div class="grid" id="g-grid"></div>
    <div class="box-empty" id="g-empty" style="display:none"><div class="big">🔭</div>No groups match these filters.</div>
    <div class="pager" id="g-pager"></div>
  </section>

  <!-- USERS VIEW -->
  <section id="view-users" class="view">
    <h1 class="section-title">Users</h1>
    <div class="section-sub">People detected as group owners, with their owned communities.</div>

    <div class="filter-panel" id="users-filters">
      <div class="filter-grid">
        <div class="field"><label>Search</label><input type="text" id="u-q" placeholder="name, location, bio…" autocomplete="off"></div>
        <div class="field"><label>Location source</label><select id="u-locsrc"></select></div>
        <div class="field"><label>Timezone</label><select id="u-tz"></select></div>
        <div class="field"><label>Has avatar</label><select id="u-avatar"><option value="">Any</option><option value="true">Yes</option></select></div>
        <div class="field"><label>Owns groups</label><select id="u-owned"><option value="">Any</option><option value="true">Yes</option></select></div>
        <div class="field"><label>Profile scraped</label><select id="u-scraped"><option value="">Any</option><option value="true">Yes</option></select></div>
        <div class="field"><label>Sort by</label><select id="u-sort">
          <option value="followers_desc">Followers ↓</option>
          <option value="followers_asc">Followers ↑</option>
          <option value="owned_desc">Owned groups ↓</option>
          <option value="name">Name A–Z</option>
        </select></div>
        <div class="range-group">
          <div class="field"><label>Followers · min</label><input type="number" id="u-min-followers" min="0"></div>
          <div class="field"><label>max</label><input type="number" id="u-max-followers" min="0"></div>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn primary" id="u-apply">Apply filters</button>
        <button class="btn ghost" id="u-clear">Clear</button>
        <div class="active-filters" id="u-chips"></div>
        <span class="filter-summary" id="u-summary"></span>
      </div>
    </div>

    <div id="u-loading" style="display:none"><div class="loader-line"></div></div>
    <div class="grid" id="u-grid"></div>
    <div class="box-empty" id="u-empty" style="display:none"><div class="big">👤</div>No users match these filters.</div>
    <div class="pager" id="u-pager"></div>
  </section>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modal-box">
    <div id="modal-content"><div class="modal-loading">Loading…</div></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
